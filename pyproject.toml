[project]
name = "ai-url-shortener"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["url_shortener", "tests"]
strict = true
show_error_codes = true
