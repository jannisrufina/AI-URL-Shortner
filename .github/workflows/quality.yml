name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql://url_shortener:local-test-password@localhost:5432/url_shortener_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: url_shortener
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U url_shortener -d url_shortener_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-dev.in
            requirements.txt
            requirements-dev.txt

      - name: Install compiled dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run quality gates
        run: python scripts/check.py

      - name: Run tests
        if: always()
        run: python -m pytest
